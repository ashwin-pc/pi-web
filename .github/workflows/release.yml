name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

      - name: Verify tag matches package version
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== `v${pkg.version}`) {
            throw new Error(`Tag ${tag} does not match package version v${pkg.version}`);
          }
          NODE

      - name: Pack release archive
        run: |
          mkdir -p release
          npm pack --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS.txt

      - name: Choose release channels
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const { readFileSync } = require('node:fs');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const prerelease = pkg.version.includes('-');
          const prereleaseTag = prerelease ? pkg.version.split('-')[1].split('.')[0] : '';
          console.log(`NPM_DIST_TAG=${prerelease ? prereleaseTag : 'latest'}`);
          console.log(`GITHUB_PRERELEASE=${prerelease ? 'true' : 'false'}`);
          NODE

      - name: Publish to npm
        run: npm publish --access public --tag "$NPM_DIST_TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ env.GITHUB_PRERELEASE }}
          files: |
            release/*.tgz
            release/SHA256SUMS.txt

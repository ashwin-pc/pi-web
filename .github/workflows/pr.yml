name: PR Checks

on:
  pull_request:
    branches:
      - "**"

jobs:
  website:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check website
        run: npm run website:check

      - name: Build website
        run: npm run website:build

      - name: Validate website output
        run: npm run website:test

  dictation-portability:
    name: Dictation portability (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Python worker and setup tests
        working-directory: examples/pi-web-extensions/dictation
        run: python -m unittest -v test_worker.py test_setup.py

      - name: TypeScript worker tests
        run: npx vitest run --config examples/pi-web-extensions/dictation/vitest.config.ts

  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Complete E2E matrix
        env:
          PI_WEB_E2E_SHARDS: 2
          PI_WEB_E2E_CONCURRENCY: 2
        run: node scripts/run-all-tests.mjs --e2e-only --skip-build

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

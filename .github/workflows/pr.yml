name: PR Checks

on:
  pull_request:
    branches:
      - "**"

jobs:
  website:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check website
        run: npm run website:check

      - name: Build website
        run: npm run website:build

      - name: Validate website output
        run: npm run website:test

  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Complete E2E matrix
        env:
          PI_WEB_E2E_SHARDS: 2
          PI_WEB_E2E_CONCURRENCY: 2
        run: node scripts/run-all-tests.mjs --e2e-only --skip-build

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

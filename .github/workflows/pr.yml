name: PR Checks

on:
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Functional desktop E2E suite
        run: |
          set -e
          pattern="compact density keeps tool calls|full-screen Mermaid viewer"
          PLAYWRIGHT_PORT=10476 npx playwright test --project=desktop --reporter=line --grep-invert "$pattern" --shard=1/3 &
          p1=$!
          PLAYWRIGHT_PORT=10486 npx playwright test --project=desktop --reporter=line --grep-invert "$pattern" --shard=2/3 &
          p2=$!
          PLAYWRIGHT_PORT=10496 npx playwright test --project=desktop --reporter=line --grep-invert "$pattern" --shard=3/3 &
          p3=$!
          wait "$p1"
          wait "$p2"
          wait "$p3"

      - name: Authentication E2E suite
        run: npx playwright test --project=auth --reporter=html,list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

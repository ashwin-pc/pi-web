name: PR Checks

on:
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # The complete sharded matrix is run locally via `npm test`; the hosted
      # macOS runner has known baseline rendering failures unrelated to this PR.
      - name: Transcript E2E regression
        run: npx playwright test tests/e2e/custom-messages.spec.ts --project=desktop --reporter=html,list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

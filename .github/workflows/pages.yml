name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "scripts/copy-website-assets.mjs"
      - "scripts/validate-website.mjs"
      - "public/new-chat-loading.mp4"
      - "public/new-chat-loading.webm"
      - "tests/e2e/visual.spec.ts-snapshots/artifact-preview-*.png"
      - "tests/e2e/visual.spec.ts-snapshots/artifacts-explorer-*.png"
      - "tests/e2e/visual.spec.ts-snapshots/conversation-tree-*.png"
      - "tests/e2e/visual.spec.ts-snapshots/core-everyday-*.png"
      - "tests/e2e/visual.spec.ts-snapshots/git-diff-viewer-*.png"
      - "tests/e2e/visual.spec.ts-snapshots/new-session-*.png"
      - "tests/e2e/visual.spec.ts-snapshots/recommended-addons-*.png"
      - "tests/e2e/visual.spec.ts-snapshots/recommended-github-*.png"
      - "tests/e2e/visual.spec.ts-snapshots/session-lanes-*.png"
      - "tests/e2e/visual.spec.ts-snapshots/website-extension-*.png"
      - "tests/e2e/visual.spec.ts-snapshots/website-work-*.png"
      - "tests/e2e/visual.spec.ts-snapshots/workspace-explorer-*.png"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check website
        run: npm run website:check

      - name: Build website
        run: npm run website:build

      - name: Validate website output
        run: npm run website:test

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
